name: Prepare ProPilot Pilot Site

on:
  workflow_dispatch:
  push:
    branches: [v19-build-validation]
    paths:
      - "src/**"
      - "ci/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "vite.config.js"
      - ".github/workflows/pilot-pages.yml"

permissions:
  contents: write

concurrency:
  group: propilot-pilot-site
  cancel-in-progress: true

jobs:
  build-and-publish-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V22
        uses: actions/checkout@v4

      - name: Reconstruct V22 main source
        run: |
          cat ci/main.part1 ci/main.part2 ci/main.part3 ci/main.part4 > src/main.jsx
          test -s src/main.jsx

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run ProPilot checks
        run: |
          node scripts/check_role_guards.mjs
          node scripts/check_pilot_flow.mjs
          node scripts/check_student_portal.mjs
          node scripts/check_ccf_dossier.mjs
          node scripts/check_ccf_alerts.mjs
          node scripts/check_ccf_score_parity.mjs

      - name: Build pilot
        run: npm run build -- --base=/ProPilot-Eco-Gestion/

      - name: Prepare static site
        run: |
          rm -rf /tmp/propilot-site
          mkdir -p /tmp/propilot-site
          cp -R dist/. /tmp/propilot-site/
          touch /tmp/propilot-site/.nojekyll

      - name: Publish static build to pilot-site branch
        run: |
          git config user.name "ProPilot CI"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan pilot-site
          git rm -rf . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R /tmp/propilot-site/. .
          git add -A
          git commit -m "Build pilote ProPilot"
          git push --force origin HEAD:pilot-site
