name: ProPilot CI

on:
  push:
    branches: [main, v19-build-validation]
  pull_request:
    branches: [main]

jobs:
  checks-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run ProPilot checks
        run: npm run check:all

      - name: Production build
        run: npm run build
